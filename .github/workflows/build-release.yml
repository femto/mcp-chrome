name: Build and Release Chrome Extension

on:
  push:
    branches: [ master ]
    paths:
      - 'app/chrome-extension/**'
      - 'app/native-server/**'
      - 'packages/**'
  workflow_dispatch:

jobs:
  build-extension:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install

    - name: Build shared packages
      run: pnpm --filter chrome-mcp-shared build

    - name: Build Chrome extension
      run: pnpm --filter chrome-mcp-extension build

    - name: Build Native server
      run: pnpm --filter mcp-chrome-bridger build

    - name: Create zip package
      run: |
        cd app/chrome-extension
        pnpm run zip

    - name: Upload Chrome extension artifact
      uses: actions/upload-artifact@v4
      with:
        name: chrome-extension-${{ github.sha }}
        path: app/chrome-extension/.output/*.zip
        retention-days: 30

    - name: Upload Native server artifact
      uses: actions/upload-artifact@v4
      with:
        name: native-server-${{ github.sha }}
        path: app/native-server/dist/
        retention-days: 30
